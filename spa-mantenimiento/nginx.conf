server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # La magia de las SPA: Si no encuentra el archivo físico, redirige al index.html
        try_files $uri $uri/ /index.html;
    }

    # Redirigir las peticiones de autenticación y API al backend de Docker
    location /login {
        proxy_pass http://tci-backend:8000/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /usuarios {
        proxy_pass http://tci-backend:8000/usuarios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Caché estática para mejorar rendimiento
    location ~* \.(?:css|js|jpg|svg)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
    }
}