server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # La magia de las SPA: Si no encuentra el archivo físico, redirige al index.html
        try_files $uri $uri/ /index.html;
    }

    # Caché estática para mejorar rendimiento
    location ~* \.(?:css|js|jpg|svg)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
    }
}