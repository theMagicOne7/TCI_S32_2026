services:
  frontend-mantenimiento:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: tci-frontend-planta
    ports:
      - "1405:80"
    restart: unless-stopped
    depends_on:
      - db-postgres

  db-postgres:
    image: postgres:16-alpine
    container_name: tci-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mantenimiento_planta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ballarre
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data

volumes:
  postgres_data_v2:
  